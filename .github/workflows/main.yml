name: Codeforces Sync

on:
  schedule:
    - cron: '0 0 * * *' # Runs automatically every day at midnight UTC
  workflow_dispatch: # Allows manual triggers

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Run CF Sync Script
        env:
          CF_HANDLE: "krishna_puri" # <-- CHANGE THIS
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python sync.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add submissions/ submission_history.json
          git diff-index --quiet HEAD || git commit -m "Automated Sync: New Codeforces Solutions Added"
          git push
